<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · {{BRAND}}</title>
<link rel="icon" href="/favicon.svg">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url("/fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: Inter; font-weight: 600; src: url("/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: Inter; font-weight: 700; src: url("/fonts/inter-latin-700-normal.woff2") format("woff2"); }
  :root { --brand:#f2780c; --ink:#16130f; --muted:#5f5850; --line:#ece6dd; --bg:#fbf9f6; --soft:#fff1e3; --bad:#e11d48; --good:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:10px; }
  header a { color:inherit; text-decoration:none; display:flex; align-items:center; gap:10px; }
  .logo { width:32px; height:32px; border-radius:9px; background:var(--ink); color:var(--brand); display:grid; place-items:center; font-weight:800; }
  main { max-width:920px; margin:28px auto 80px; padding:0 16px; display:grid; gap:20px; grid-template-columns:1fr 1.1fr; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:20px; }
  .product img { width:100%; border-radius:14px; display:block; }
  h1 { font-size:1.35rem; margin:14px 0 4px; letter-spacing:-.01em; }
  .muted { color:var(--muted); font-size:.9rem; }
  .price { font-size:1.4rem; font-weight:700; margin-top:8px; } .price s { font-size:1rem; color:var(--muted); font-weight:400; }
  label { display:block; font-size:.85rem; font-weight:600; margin:12px 0 5px; }
  input, select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pay { display:flex; gap:10px; } .pay label { flex:1; margin:0; font-weight:500; border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; gap:8px; align-items:center; }
  button { width:100%; margin-top:18px; background:var(--brand); color:#fff; border:0; border-radius:999px; padding:13px; font:inherit; font-weight:700; font-size:1rem; cursor:pointer; }
  .error { background:#fff0f3; color:var(--bad); border-radius:12px; padding:10px 12px; font-size:.9rem; margin-bottom:6px; }
  .ok { text-align:center; padding:36px 24px; grid-column:1 / -1; }
  .ok .tick { width:56px; height:56px; border-radius:50%; background:#eafaf0; color:var(--good); display:grid; place-items:center; margin:0 auto 10px; font-size:28px; }
  .badge { display:inline-block; background:var(--soft); color:#b4570a; border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:600; }
  .back { display:inline-block; margin-top:18px; color:var(--brand); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<header><a href="/store"><div class="logo">G</div><b>{{BRAND}}</b></a><span class="muted">· demo checkout (no real payment or delivery)</span></header>
<main>{{CONTENT}}</main>
</body>
</html>
